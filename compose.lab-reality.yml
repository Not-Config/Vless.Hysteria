services:
  lab-reality:
    image: ${XRAY_IMAGE}
    container_name: vpn-lab-reality
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ./lab-reality/config.json:/usr/local/etc/xray/config.json:ro
    command:
      - run
      - -config
      - /usr/local/etc/xray/config.json
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
