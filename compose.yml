services:
  xray:
    image: ${XRAY_IMAGE}
    container_name: vpn-xray
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ./xray/config.json:/usr/local/etc/xray/config.json:ro
    command:
      - run
      - -config
      - /usr/local/etc/xray/config.json
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  hysteria:
    image: ${HYSTERIA_IMAGE}
    container_name: vpn-hysteria
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ./hysteria/config.yaml:/etc/hysteria/config.yaml:ro
      - ./hysteria/certs:/etc/hysteria/certs:ro
    command:
      - server
      - -c
      - /etc/hysteria/config.yaml
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ${NGINX_IMAGE}
    container_name: vpn-web
    restart: unless-stopped
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - ./web/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web/html:/usr/share/nginx/html:ro
      - ./hysteria/certs:/etc/nginx/tls:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
