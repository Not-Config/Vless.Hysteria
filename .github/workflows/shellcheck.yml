name: ShellCheck

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Validate Bash syntax
        run: |
          bash -n \
            install.sh \
            configure.sh \
            status.sh \
            user.sh \
            backup.sh \
            diagnostics.sh \
            update.sh \
            uninstall.sh \
            watchdog.sh \
            lab-grpc.sh \
            lib/common.sh
      - name: Check shell scripts
        run: |
          shellcheck --severity=error \
            install.sh \
            configure.sh \
            status.sh \
            user.sh \
            backup.sh \
            diagnostics.sh \
            update.sh \
            uninstall.sh \
            watchdog.sh \
            lab-grpc.sh \
            lib/common.sh
